<style>
  /* 与首页同一套 ROG 奥创令牌：近黑底、ROG 红单一强调色、2px 圆角。
     这里不引外部样式表 —— 404 很可能就是路径问题引起的。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #121212; color: #ffffff;
    font: 15px/1.75 "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  .box { max-width: 520px; text-align: center; }

  /* MSI LIGHTNING 矢量横向组合；内联资源确保错误路径也能显示。 */
  .lockup { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 auto 22px; }
  .lockup .eye { display: block; width: 32px; height: auto; }
  .lockup .wordmark { display: block; width: 210px; height: auto; }

  h1 { font-size: 22px; margin-bottom: 10px; font-weight: 700; }
  .code {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    color: #8a8a8a; margin-bottom: 18px; letter-spacing: .06em;
  }
  /* 斜切红条：与首页关键数值下方的斜切下划条同一种形态 */
  .bar {
    width: 48px; height: 4px; margin: 0 auto 18px; background: #ff0033;
    clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
  }
  p { color: #8a8a8a; font-size: 14px; margin-bottom: 26px; }
  /* 按钮保持干净矩形。不给可聚焦元素用 clip-path ——
     那会连 :focus-visible 的焦点环一起裁掉，键盘用户就看不到焦点了。 */
  a.home {
    display: inline-block; padding: 12px 28px;
    /* 白字在 #ff0033 上实测 3.96:1，14px 粗体未达大字号阈值，压深到 6.2:1 */
    background: #c40028; color: #fff; font-weight: 700;
    text-decoration: none; font-size: 14px; border-radius: 2px;
  }
  a.home:hover { background: #a80021; }
  .hint { margin-top: 26px; font-size: 12.5px; color: #8a8a8a; }
</style>
